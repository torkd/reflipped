        <header class="page-header">
            <h1 class="page-title">Two-step login</h1>
            <p class="page-subtitle">Enter the 6-digit code your authenticator app shows for Reflipped.</p>
        </header>
{{notice}}
        <form class="card" method="post" action="{{action}}">
            <label class="field">Code
                <input class="input tabular-nums" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" maxlength="7" required autofocus>
            </label>
            <button type="submit" class="btn-primary">Continue</button>
        </form>
        <form method="post" action="/logout">
            <button type="submit" class="btn-outline">Cancel</button>
        </form>
