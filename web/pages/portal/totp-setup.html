        <header class="page-header">
            <h1 class="page-title">Turn on two-step login</h1>
            <p class="page-subtitle">Scan the code with an authenticator app, then enter the 6 digits it shows.</p>
        </header>
{{notice}}
        <section class="card">
            <img class="qr-code" src="{{qrCode}}" alt="QR code for your authenticator app">
            <p class="card-text">Can't scan it? Enter this key in the app instead:</p>
            <code class="stat-value text-base break-all">{{secret}}</code>
            <form class="flex flex-col gap-4" method="post" action="/portal/totp">
                <input type="hidden" name="csrf" value="{{csrf}}">
                <label class="field">Code
                    <input class="input tabular-nums" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" maxlength="7" required autofocus>
                </label>
                <div class="flex gap-3 flex-wrap">
                    <button type="submit" class="btn-primary">Turn on</button>
                    <a href="/portal" class="btn-outline">Cancel</a>
                </div>
            </form>
        </section>
