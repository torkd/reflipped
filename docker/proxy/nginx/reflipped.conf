# Reflipped behind an nginx you already run on the host (docker/proxy flavour: Reflipped on 127.0.0.1:8000).
# Copy to /etc/nginx/conf.d/ (or sites-available/ + a symlink), replace reflipped.example.com and the
# asset path, get a certificate (e.g. `certbot --nginx -d reflipped.example.com`), then `nginx -t && nginx -s reload`.
#
# To put this nginx in front of a flavour's edge instead (stack, api or assets, with TLS off and
# EDGE_BIND=127.0.0.1), drop the asset location and point proxy_pass at http://127.0.0.1:8080.

upstream reflipped {
    server 127.0.0.1:8000;      # API_PORT; with nginx in a container on PROXY_NETWORK: reflipped:8000
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name reflipped.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name reflipped.example.com;

    ssl_certificate     /etc/letsencrypt/live/reflipped.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reflipped.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Game requests carry headers with underscores (device_lang, short_udid, res_ver, ...).
    underscores_in_headers on;
    client_max_body_size 50m;

    # Translation overlays (npm run i18n:build; the folder CDN_OVERLAY_DIR points at, default .cdn-overlay
    # next to .cdn), before the asset block: only their archives are public, not the manifest.
    location ^~ /patch/Live/2.0.0/overlay/ {
        alias /srv/reflipped/.cdn-overlay/;
        autoindex off;
        gzip off;
        sendfile on;
        deny all;
        location ~ ^/patch/Live/2\.0\.0/overlay/[a-z][a-z]/[A-Za-z0-9_.-]+\.zip$ {
            allow all;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
    }

    # Asset archives straight from disk (the folder CDN_DIR points at). nginx needs read access to it.
    # Without this block, the requests fall through to Reflipped, which serves them too (slower).
    location /patch/Live/2.0.0/ {
        alias /srv/reflipped/.cdn/;
        autoindex off;
        gzip off;
        sendfile on;
        tcp_nopush on;
        location ~ /\. { deny all; }
        location = /patch/Live/2.0.0/metadata.json { deny all; }
        # Archive names contain a content hash, so they never change.
        location ~ ^/patch/Live/2\.0\.0/[a-z]+/archive-[^/]+/[^/]+\.zip$ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    location / {
        proxy_pass http://reflipped;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, don't append: Reflipped trusts this header from the proxy.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
